
<!DOCTYPE html>
<html>
    <head>
        <title>registration form</title>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, Initial-scale = 1">
        <meta property = "og:title" content = "registration form"/>
        <meta property = "og:type"content = "website"/>
        <meta property = "og:url" content="https://signup.com"/>
        <link href = "style.css" rel = "stylesheet">
    </head>
    <body>
        <header>
            <img src = "logo2.png" alt = "logo" class = "logo" width = "150" height = "150">
        </header>
       <div class = "container">
        <form class = "registration-form" action = "/registration " method ="post">
            <h2>SIGN-UP</h2>

            <div class = "form-row">
                <div class = "form-group">
                    <label for = "Firstname">Firstname</label>
                    <input type = "text" id = "Firstname" name = "Firstname">
                </div>

                <div class = "form-group">
                    <label for = "Lastname">Lastname</label>
                    <input type ="text" id = "Lastname" name = "Lastname">
                </div>

                <div class = "form-group">
                    <label for = "Age">Age</label>
                    <input type = "number" id = "Age" name = "Age" >
                </div>

                <div class = "form-group">
                    <label for = "Tel">Phone</label>
                    <input type = "tel" id = "Tel" name = Tel>
                </div>

            </div>

            <div class = "form-row">
                <div class ="form-group">
                    <label for = "signup-Email">Email</label>
                    <input type = "email" id = "signup-Email" name = "signup-Email" placeholder="example@gmail.com">
                </div>

                <div class = "form-group">
                    <label for = "Password">Password</label>
                    <input type ="password" id ="Password" name = "password">
                </div>

                <div class = "form-group">
                    <label for = "Birthday">Birthday</label>
                    <input type = "date" id ="Birthday" name = "Birthday">
                </div>
            </div>

            <div class = "form-row">
                <div class = "form-group">
                 <label for = "state">State</label>
                <select id = "state" name = "state" required>
                    <option value ="">--Choose state--</option>
                    <option value = "abuja">FCT</option>
                    <option value = "Lagos">Lagos</option>
                    <option value = "Rivers">Rivers</option>
                </select>
                </div>

                <div class = "form-group">
                    <label for = "city">City</label>
                    <input type = "text" id = "city" name = "city">
                </div>

            </div>

            <div class = "form-row">
                <div class = "form-group">
                    <label for = "Address">Address</label>
                    <input type = "text" id = "Address" name = "Address">
                </div>

            </div>
            <div class = "form-row">
                <div class = "form-group">
                    <button type = "submit">SIGN UP</button>
                </div>
            </div>
            

            
                
       
            
            
         
        </form>

       </div>
    </body>
</html>
